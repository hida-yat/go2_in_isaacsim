display_name = "Go2 Policy Example (unitree_rl_lab)"

[package]
version = "0.5.0"
category = "Simulation"
title = "Unitree Go2 RL Policy Example"
description = "Runs a unitree_rl_lab-trained Go2 locomotion policy in pure Isaac Sim, in the style of the built-in Spot Quadruped example. Robot/environment USD and policy checkpoint are configurable from Edit > Preferences > Go2 Policy Example. Optional ROS2 bridge: drive from cmd_vel, publish odom/tf/joint_states/clock for nav2. Optional Mid-360 lidar and physics IMU, published as PointCloud2 and Imu."
repository = ""
keywords = ["isaac", "robot", "quadruped", "go2", "unitree", "policy"]
readme = "docs/README.md"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.core.api" = {}
"isaacsim.examples.browser" = {}
"isaacsim.examples.interactive" = {}
"isaacsim.robot.policy.examples" = {}
"omni.graph.core" = {}
"omni.kit.uiapp" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.window.preferences" = {}
# isaacsim.ros2.bridge, isaacsim.sensors.rtx and isaacsim.sensors.physics
# are enabled lazily when ROS2 and a sensor-equipped robot are selected
# (see ros2_bridge.py / mid360.py / imu.py) so this extension still starts cleanly
# without a working ROS2 install or RTX renderer sensor support.

[[python.module]]
name = "go2_in_isaacsim"
